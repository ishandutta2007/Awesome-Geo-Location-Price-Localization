<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pillShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35"/>
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#primaryGrad);
      letter-spacing: -1px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .stat-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 15px;
      fill: #38bdf8;
    }

    /* Dynamic CSS animations */
    @keyframes pulseGlow1 {
      0% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.15); opacity: 0.6; }
      100% { transform: scale(1); opacity: 0.35; }
    }
    @keyframes pulseGlow2 {
      0% { transform: scale(1.1); opacity: 0.3; }
      50% { transform: scale(0.95); opacity: 0.55; }
      100% { transform: scale(1.1); opacity: 0.3; }
    }
    @keyframes floatPill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatPillReverse {
      0% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -100; }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .anim-glow1 {
      transform-origin: 200px 100px;
      animation: pulseGlow1 8s ease-in-out infinite;
    }
    .anim-glow2 {
      transform-origin: 1000px 300px;
      animation: pulseGlow2 10s ease-in-out infinite;
    }
    .anim-pill1 {
      animation: floatPill 5s ease-in-out infinite;
    }
    .anim-pill2 {
      animation: floatPillReverse 6s ease-in-out infinite;
    }
    .anim-pill3 {
      animation: floatPill 5.5s ease-in-out infinite;
    }
    .anim-dash {
      stroke-dasharray: 6 6;
      animation: dashTravel 20s linear infinite;
    }
    .anim-ring {
      transform-origin: 1080px 120px;
      animation: rotateRing 40s linear infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Background Orbs (Depth Layer) -->
  <g class="anim-glow1">
    <circle cx="200" cy="100" r="160" fill="url(#cyanGlow)" />
  </g>
  <g class="anim-glow2">
    <circle cx="1000" cy="300" r="190" fill="url(#purpleGlow)" />
  </g>

  <!-- Dynamic Background Geometric Lines & Globe Elements -->
  <g opacity="0.35">
    <!-- Curved connection flows -->
    <path class="anim-dash" d="M 50 350 Q 300 200 600 320 T 1150 180" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="anim-dash" d="M 80 80 Q 400 280 800 120 T 1120 360" fill="none" stroke="#818cf8" stroke-width="1.5" />

    <!-- Abstract Globe Wireframe on Right -->
    <g class="anim-ring">
      <circle cx="1080" cy="120" r="90" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 4" />
      <ellipse cx="1080" cy="120" rx="90" ry="35" fill="none" stroke="#818cf8" stroke-width="1.2" />
      <ellipse cx="1080" cy="120" rx="35" ry="90" fill="none" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="1080" cy="120" r="6" fill="#38bdf8" filter="url(#glowFilter)" />
    </g>
  </g>

  <!-- TOP BRANDING / TAGLINE (FOREGROUND) -->
  <g transform="translate(80, 75)">
    <rect x="-12" y="-18" width="290" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="2" cy="-2" r="5" fill="#38bdf8" />
    <text x="18" y="2" class="tagline-text">Curated Engineering Ecosystem</text>
  </g>

  <!-- MAIN TITLE (PROMINENT FOREGROUND) -->
  <g transform="translate(80, 145)">
    <text x="0" y="0" class="title-text">Awesome Geo-Location &amp;</text>
    <text x="0" y="52" class="title-text">Price Localization</text>
  </g>

  <!-- SUBTITLE (FOREGROUND) -->
  <g transform="translate(80, 240)">
    <text x="0" y="0" class="subtitle-text">Empowering digital products, SaaS &amp; e-commerce with real-time currency conversion,</text>
    <text x="0" y="26" class="subtitle-text">Purchasing Power Parity (PPP), geo-targeting &amp; price optimization architectures.</text>
  </g>

  <!-- DYNAMIC FEATURE PILLS (Interactive / Layered at bottom) -->
  <g transform="translate(80, 310)">
    <!-- Pill 1: Geo-Targeting -->
    <g class="anim-pill1" transform="translate(0, 0)" filter="url(#pillShadow)">
      <rect width="210" height="48" rx="24" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="28" cy="24" r="14" fill="#0369a1" fill-opacity="0.5"/>
      <text x="28" y="29" font-size="16" text-anchor="middle">📍</text>
      <text x="52" y="28" class="pill-label">Geo-Targeting &amp; IP</text>
    </g>

    <!-- Pill 2: PPP Adjustments -->
    <g class="anim-pill2" transform="translate(230, 0)" filter="url(#pillShadow)">
      <rect width="225" height="48" rx="24" fill="url(#badgeGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="28" cy="24" r="14" fill="#4338ca" fill-opacity="0.5"/>
      <text x="28" y="29" font-size="16" text-anchor="middle">⚖️</text>
      <text x="52" y="28" class="pill-label">Purchasing Power (PPP)</text>
    </g>

    <!-- Pill 3: Multi-Currency -->
    <g class="anim-pill3" transform="translate(475, 0)" filter="url(#pillShadow)">
      <rect width="235" height="48" rx="24" fill="url(#badgeGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="28" cy="24" r="14" fill="#7e22ce" fill-opacity="0.5"/>
      <text x="28" y="29" font-size="16" text-anchor="middle">💱</text>
      <text x="52" y="28" class="pill-label">Multi-Currency &amp; FX</text>
    </g>

    <!-- Pill 4: Dynamic Pricing -->
    <g class="anim-pill1" transform="translate(730, 0)" filter="url(#pillShadow)">
      <rect width="220" height="48" rx="24" fill="url(#badgeGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="28" cy="24" r="14" fill="#065f46" fill-opacity="0.5"/>
      <text x="28" y="29" font-size="16" text-anchor="middle">📈</text>
      <text x="52" y="28" class="pill-label">Price Optimization</text>
    </g>
  </g>

  <!-- Top Right Metric / Ecosystem Highlight Box -->
  <g transform="translate(930, 45)" filter="url(#pillShadow)">
    <rect width="190" height="54" rx="12" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1.2"/>
    <text x="20" y="25" class="tagline-text" fill="#94a3b8" font-size="10">ECOSYSTEM</text>
    <text x="20" y="44" class="stat-label">SaaS &amp; Open Source</text>
    <circle cx="160" cy="27" r="8" fill="#10b981" fill-opacity="0.2"/>
    <circle cx="160" cy="27" r="4" fill="#10b981"/>
  </g>

  <!-- Border Accent Outline -->
  <rect width="1200" height="420" rx="16" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.6"/>
</svg>
