<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#0a0f1d"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="badgeGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".85"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><linearGradient id="cyanGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".4"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></linearGradient><linearGradient id="purpleGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#c084fc" stop-opacity=".35"/><stop offset="100%" stop-color="#818cf8" stop-opacity="0"/></linearGradient><filter id="glowFilter" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="pillShadow" width="120%" height="150%" x="-10%" y="-20%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".5" stdDeviation="6"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".35" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#475569" fill-opacity=".4"/></pattern></defs><style>@keyframes pulseGlow1{0%{transform:scale(1);opacity:.35}50%{transform:scale(1.15);opacity:.6}}@keyframes pulseGlow2{0%{transform:scale(1.1);opacity:.3}50%{transform:scale(.95);opacity:.55}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes floatPillReverse{0%{transform:translateY(0)}50%{transform:translateY(6px)}}@keyframes rotateRing{0%{transform:rotate(0deg)}}.title-text{font-weight:800;font-size:46px;fill:url(#primaryGrad);letter-spacing:-1px}.pill-label,.stat-label,.subtitle-text,.tagline-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:400;font-size:19px;fill:#94a3b8;letter-spacing:.2px}.pill-label,.tagline-text{font-weight:600;font-size:13px}.tagline-text{fill:#38bdf8;letter-spacing:2px;text-transform:uppercase}.pill-label{fill:#e2e8f0}.stat-label{font-weight:700;font-size:15px;fill:#38bdf8}.anim-glow1{transform-origin:200px 100px;animation:pulseGlow1 8s ease-in-out infinite}.anim-glow2{transform-origin:1000px 300px;animation:pulseGlow2 10s ease-in-out infinite}.anim-pill1{animation:floatPill 5s ease-in-out infinite}.anim-pill2{animation:floatPillReverse 6s ease-in-out infinite}.anim-pill3{animation:floatPill 5.5s ease-in-out infinite}.anim-dash{stroke-dasharray:6 6;animation:dashTravel 20s linear infinite}.anim-ring{transform-origin:1080px 120px;animation:rotateRing 40s linear infinite}</style><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g class="anim-glow1"><circle cx="200" cy="100" r="160" fill="url(#cyanGlow)"/></g><g class="anim-glow2"><circle cx="1000" cy="300" r="190" fill="url(#purpleGlow)"/></g><g opacity=".35"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 50 350 Q 300 200 600 320 T 1150 180" class="anim-dash"/><path fill="none" stroke="#818cf8" stroke-width="1.5" d="M 80 80 Q 400 280 800 120 T 1120 360" class="anim-dash"/><g class="anim-ring"><circle cx="1080" cy="120" r="90" fill="none" stroke="#64748b" stroke-dasharray="4 4" stroke-width="1.2"/><ellipse cx="1080" cy="120" fill="none" stroke="#818cf8" stroke-width="1.2" rx="90" ry="35"/><ellipse cx="1080" cy="120" fill="none" stroke="#38bdf8" stroke-width="1.2" rx="35" ry="90"/><circle cx="1080" cy="120" r="6" fill="#38bdf8" filter="url(#glowFilter)"/></g></g><g transform="translate(80, 75)"><rect width="290" height="32" x="-12" y="-18" fill="#1e293b" fill-opacity=".8" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1" rx="16"/><circle cx="2" cy="-2" r="5" fill="#38bdf8"/><text x="18" y="2" class="tagline-text">Curated Engineering Ecosystem</text></g><g><text x="0" y="0" class="title-text" transform="translate(80, 145)">Awesome Geo-Location &amp;</text><text x="0" y="52" class="title-text" transform="translate(80, 145)">Price Localization</text></g><g><text x="0" y="0" class="subtitle-text" transform="translate(80, 240)">Empowering digital products, SaaS &amp; e-commerce with real-time currency conversion,</text><text x="0" y="26" class="subtitle-text" transform="translate(80, 240)">Purchasing Power Parity (PPP), geo-targeting &amp; price optimization architectures.</text></g><g><g class="anim-pill1" filter="url(#pillShadow)" transform="translate(80, 310) translate(0, 0)"><rect width="210" height="48" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity=".7" stroke-width="1.2" rx="24"/><circle cx="28" cy="24" r="14" fill="#0369a1" fill-opacity=".5"/><text x="28" y="29" font-size="16" text-anchor="middle">📍</text><text x="52" y="28" class="pill-label">Geo-Targeting &amp; IP</text></g><g class="anim-pill2" filter="url(#pillShadow)" transform="translate(80, 310) translate(230, 0)"><rect width="225" height="48" fill="url(#badgeGrad)" stroke="#818cf8" stroke-opacity=".7" stroke-width="1.2" rx="24"/><circle cx="28" cy="24" r="14" fill="#4338ca" fill-opacity=".5"/><text x="28" y="29" font-size="16" text-anchor="middle">⚖️</text><text x="52" y="28" class="pill-label">Purchasing Power (PPP)</text></g><g class="anim-pill3" filter="url(#pillShadow)" transform="translate(80, 310) translate(475, 0)"><rect width="235" height="48" fill="url(#badgeGrad)" stroke="#c084fc" stroke-opacity=".7" stroke-width="1.2" rx="24"/><circle cx="28" cy="24" r="14" fill="#7e22ce" fill-opacity=".5"/><text x="28" y="29" font-size="16" text-anchor="middle">💱</text><text x="52" y="28" class="pill-label">Multi-Currency &amp; FX</text></g><g class="anim-pill1" filter="url(#pillShadow)" transform="translate(80, 310) translate(730, 0)"><rect width="220" height="48" fill="url(#badgeGrad)" stroke="#34d399" stroke-opacity=".7" stroke-width="1.2" rx="24"/><circle cx="28" cy="24" r="14" fill="#065f46" fill-opacity=".5"/><text x="28" y="29" font-size="16" text-anchor="middle">📈</text><text x="52" y="28" class="pill-label">Price Optimization</text></g></g><g filter="url(#pillShadow)" transform="translate(930, 45)"><rect width="190" height="54" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1.2" rx="12"/><text x="20" y="25" fill="#94a3b8" class="tagline-text" font-size="10">ECOSYSTEM</text><text x="20" y="44" class="stat-label">SaaS &amp; Open Source</text><circle cx="160" cy="27" r="8" fill="#10b981" fill-opacity=".2"/><circle cx="160" cy="27" r="4" fill="#10b981"/></g><rect width="1200" height="420" fill="none" stroke="#334155" stroke-opacity=".6" stroke-width="1.2" rx="16"/></svg>